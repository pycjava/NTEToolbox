[package]
name = "ntetoolbox-client"
version = "0.0.0"
description = "MaaToolbox Tauri client"
authors = ["op200"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/op200/NTEToolbox"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ntetoolbox_client_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
