[build-system]
requires = [
    "setuptools>=82",
]

[project]
authors = [{ name = "op200" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "maafw>=5.10.4",
    "music21>=10.1.0",
]
dynamic = ["version"]
license = "AGPL-3.0-or-later"
name = "ntetoolbox"
readme = "README.md"
requires-python = ">=3.14"

[project.urls]
Homepage = "https://github.com/op200/NTEToolbox"
Source   = "https://github.com/op200/NTEToolbox"

[project.optional-dependencies]
hearthstone = [
    "hslog>=1.19.0",
    "httpx>=0.27",
    # hslog 会传递依赖 hearthstone，但 hscoach 代码直接 import
    # hearthstone.enums，故显式声明，避免依赖链变化时漏装。
    "hearthstone>=9.0.0",
]
# 开发/测试工具（非运行时依赖）：tools/patch_test_manifest.py（sandbox 专用
# Rust 测试 helper）需要 pefile 解析/改写 PE 资源。安装：pip install -e ".[dev]"
dev = [
    "pefile>=2024.8.26",
]

[tool.setuptools]
packages = ["agent", "hscoach"]

[tool.setuptools.dynamic]
version = { attr = "agent._version.__version__" }

[tool.setuptools.package-data]
ntetoolbox = ["assets/**/*"]

[tool.pytest.ini_options]
# testpaths 锁定 tests/，避免误收 build 产物。
# 注：tests/__init__.py 让 tests 成为正规包，`from tests._helpers import ...`
# 即可工作（之前缺 __init__.py 导致 5 个测试模块收集失败）。
testpaths = ["tests"]
